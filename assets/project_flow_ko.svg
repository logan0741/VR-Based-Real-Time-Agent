<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="760" viewBox="0 0 1760 760" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="880" y="48" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">최종 시스템 — 2D 관절점 기반 실시간 자세 피드백 (2026-06)</text><rect x="30" y="90" width="440" height="550" rx="10" fill="#eef2ff" stroke="#475569" stroke-width="1.5"/><text x="50" y="125" font-size="21" font-weight="bold" text-anchor="start" fill="#1f2937">스마트폰 브라우저</text><text x="50" y="150" font-size="15" font-weight="normal" text-anchor="start" fill="#475569">viewer (final/s05_frontend)</text><rect x="50" y="181" width="400" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="66" y="215" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• 카메라 (세로 모드 지원)</text><rect x="50" y="261" width="400" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="66" y="295" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• TF.js MoveNet Lightning (브라우저 추론)</text><rect x="50" y="341" width="400" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="66" y="375" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• COCO-17 [y, x, conf] 정규화 0~1</text><rect x="50" y="421" width="400" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="66" y="455" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• 로컬 스켈레톤 즉시 그리기</text><rect x="50" y="501" width="400" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="66" y="535" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• WebSocket /ws/pose 로 30fps 전송</text><rect x="590" y="90" width="540" height="550" rx="10" fill="#ecfdf5" stroke="#475569" stroke-width="1.5"/><text x="610" y="125" font-size="21" font-weight="bold" text-anchor="start" fill="#1f2937">FastAPI 서버</text><text x="610" y="150" font-size="15" font-weight="normal" text-anchor="start" fill="#475569">final/s02_backend/server.py</text><rect x="610" y="165" width="500" height="62" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="630" y="192" font-size="17" font-weight="bold" text-anchor="start" fill="#1f2937">① 즉시 relay 경로 — data_type: pose</text><text x="630" y="216" font-size="14" font-weight="normal" text-anchor="start" fill="#047857">로컬 평균 4.2 ms</text><rect x="610" y="240" width="500" height="335" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="630" y="266" font-size="16" font-weight="bold" text-anchor="start" fill="#1f2937">② 처리 경로 (최신 프레임만, 오래된 프레임 드롭)</text><rect x="640" y="280" width="440" height="34" rx="6" fill="#ecfdf5" stroke="#475569" stroke-width="1.2"/><text x="860" y="303" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2937">카메라 가시성 게이트 (conf ≥ 0.12)</text><polyline points="860,314 860,325" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/><rect x="640" y="325" width="440" height="34" rx="6" fill="#ecfdf5" stroke="#475569" stroke-width="1.2"/><text x="860" y="348" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2937">골반 기준 정규화</text><polyline points="860,359 860,370" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/><rect x="640" y="370" width="440" height="34" rx="6" fill="#ecfdf5" stroke="#475569" stroke-width="1.2"/><text x="860" y="393" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2937">반복(rep) 감지 — 관절 신호 기반</text><polyline points="860,404 860,415" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/><rect x="640" y="415" width="440" height="34" rx="6" fill="#ecfdf5" stroke="#475569" stroke-width="1.2"/><text x="860" y="438" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2937">DTW 전문가 비교 (interval)</text><polyline points="860,449 860,460" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/><rect x="640" y="460" width="440" height="34" rx="6" fill="#ecfdf5" stroke="#475569" stroke-width="1.2"/><text x="860" y="483" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2937">점수 0~100</text><polyline points="860,494 860,505" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/><rect x="640" y="505" width="440" height="34" rx="6" fill="#ecfdf5" stroke="#475569" stroke-width="1.2"/><text x="860" y="528" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2937">피드백 엔진 + hold 정책 → bad_joints</text><text x="1100" y="562" font-size="14" font-weight="normal" text-anchor="end" fill="#047857">로컬 평균 9.5 ms</text><rect x="610" y="586" width="150" height="44" rx="8" fill="#fff7ed" stroke="#475569" stroke-width="1.2"/><text x="685" y="606" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">전문가 포즈 캐시</text><text x="685" y="623" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">(.npy, 4종목)</text><rect x="790" y="586" width="150" height="44" rx="8" fill="#fff7ed" stroke="#475569" stroke-width="1.2"/><text x="865" y="606" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">s07 TTS (운동 종료 후</text><text x="865" y="623" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">최종 피드백 음성)</text><rect x="970" y="586" width="150" height="44" rx="8" fill="#fff7ed" stroke="#475569" stroke-width="1.2"/><text x="1045" y="606" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">s03 MySQL</text><text x="1045" y="623" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">(선택)</text><rect x="1270" y="90" width="460" height="550" rx="10" fill="#fff7ed" stroke="#475569" stroke-width="1.5"/><text x="1290" y="125" font-size="21" font-weight="bold" text-anchor="start" fill="#1f2937">Meta Quest 3 브라우저</text><text x="1290" y="150" font-size="15" font-weight="normal" text-anchor="start" fill="#475569">app (final/src, React)</text><rect x="1290" y="181" width="420" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="1306" y="215" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• 2D 스켈레톤: 사용자 vs 전문가</text><rect x="1290" y="261" width="420" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="1306" y="295" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• 세트·횟수·타이머·점수 링</text><rect x="1290" y="341" width="420" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="1306" y="375" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• 틀린 관절 빨간색 표시</text><rect x="1290" y="421" width="420" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="1306" y="455" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• 세트 완료 자동 판정 (sets × reps)</text><rect x="1290" y="501" width="420" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="1306" y="535" font-size="16" font-weight="normal" text-anchor="start" fill="#1f2937">• 최종 리포트 + TTS 재생</text><polyline points="472,300 588,300" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/><text x="530" y="262" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">keypoints</text><text x="530" y="282" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">(프레임당 ~1KB)</text><polyline points="1132,196 1268,196" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/><text x="1200" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">pose</text><text x="1200" y="170" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">(실시간 스켈레톤)</text><polyline points="1132,430 1268,430" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/><text x="1200" y="372" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">feedback</text><text x="1200" y="392" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">(점수·횟수·</text><text x="1200" y="411" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">메시지·빨간 관절)</text><rect x="30" y="665" width="1700" height="70" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/><text x="880" y="708" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2937">같은 경로를 Cloudflare 터널(*.gun-hee.com)로 보내면 relay 201 ms · 처리 206 ms — 병목은 백엔드가 아니라 네트워크</text></svg>