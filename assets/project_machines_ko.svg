<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="620" viewBox="0 0 1760 620" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="880" y="40" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">장비로 보면 — 스마트폰 · PC 서버 · Quest 3, 그리고 터널</text><rect x="540" y="70" width="680" height="78" rx="39" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/><text x="880" y="104" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Cloudflare 터널</text><text x="880" y="131" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2937">wss://pt.gun-hee.com/ws/pose (viewer·app 공용 WebSocket 엔드포인트)</text><rect x="40" y="230" width="440" height="250" rx="10" fill="#eef2ff" stroke="#475569" stroke-width="1.5"/><text x="260" y="270" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">스마트폰 (카메라 담당)</text><text x="260" y="300" font-size="16" font-weight="normal" text-anchor="middle" fill="#475569">viewer 페이지 · TF.js MoveNet</text><text x="64" y="345" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">로컬 (카메라는 HTTPS 필요 → 터널 권장):</text><text x="64" y="375" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">http://&lt;PC_IP&gt;:8000/viewer/</text><text x="64" y="405" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">도메인:</text><text x="64" y="435" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">https://viewer.gun-hee.com/viewer/</text><rect x="660" y="230" width="440" height="250" rx="10" fill="#ecfdf5" stroke="#475569" stroke-width="1.5"/><text x="880" y="270" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">PC 서버 (Windows)</text><text x="880" y="300" font-size="16" font-weight="normal" text-anchor="middle" fill="#475569">FastAPI + uvicorn :8000</text><text x="684" y="345" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">s01 전처리 · s02 서버 · s07 TTS</text><text x="684" y="375" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">정적 서빙: /viewer/ · /app/ · /api/*</text><text x="684" y="405" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">cloudflared 터널</text><text x="684" y="435" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">GPU·3D 모델 없음 (CPU)</text><rect x="1280" y="230" width="440" height="250" rx="10" fill="#fff7ed" stroke="#475569" stroke-width="1.5"/><text x="1500" y="270" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">Meta Quest 3 (화면 담당)</text><text x="1500" y="300" font-size="16" font-weight="normal" text-anchor="middle" fill="#475569">브라우저에서 app 페이지</text><text x="1304" y="345" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">로컬:</text><text x="1304" y="375" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">http://&lt;PC_IP&gt;:8000/app/</text><text x="1304" y="405" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">도메인:</text><text x="1304" y="435" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1f2937">https://app.gun-hee.com/app/</text><polyline points="482,375 658,375" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/><polyline points="1102,375 1278,375" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/><text x="570" y="340" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">같은 Wi-Fi (LAN)</text><text x="570" y="360" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">≈4~10 ms</text><text x="1190" y="340" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">같은 Wi-Fi (LAN)</text><text x="1190" y="360" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2937">≈4~10 ms</text><polyline points="260,228 260,109 538,109" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><polyline points="1222,109 1520,109 1520,228" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><polyline points="880,228 880,150" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ah)"/><text x="270" y="200" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">인터넷 경유 ≈200 ms</text><text x="1510" y="200" font-size="14" font-weight="bold" text-anchor="end" fill="#c2410c">인터넷 경유 ≈200 ms</text><text x="895" y="200" font-size="13" font-weight="normal" text-anchor="start" fill="#c2410c">cloudflared</text><rect x="40" y="520" width="1680" height="62" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/><text x="880" y="558" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2937">GPU·3D 모델 없음 — 서버는 CPU 에서 돌고, 포즈 추정은 스마트폰 브라우저가 한다</text></svg>